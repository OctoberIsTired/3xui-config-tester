<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">3xui-config-tester</title>
  <desc id="description">Controlled Xray inbound experiments, from a temporary clone to measurable results.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="0.58" stop-color="#102c42"/>
      <stop offset="1" stop-color="#0a1726"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45d5e9"/>
      <stop offset="1" stop-color="#56d89c"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#79b4cc" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1078" cy="46" r="165" fill="#2d7690" opacity=".13"/>
  <circle cx="711" cy="360" r="168" fill="#32ab91" opacity=".08"/>
  <g transform="translate(58 66)">
